version: 2

# Actions are pinned to commit SHAs so an upstream change cannot land in CI — and in the
# deploy gate — without review. That trades a supply-chain risk for a staleness risk: a pinned
# action never picks up its own security fixes. Dependabot closes that gap by opening PRs when
# the pinned SHA falls behind, so the pins stay current without anyone tracking them by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
