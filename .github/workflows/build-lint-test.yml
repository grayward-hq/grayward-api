name: Build, Lint and Test
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege: nothing here writes to the repository. Without this the default
# token is read/write across it, and this workflow runs on every branch and every
# pull request — including from forks.
permissions:
  contents: read

jobs:
  build-dotnet:
    name: Build and Test .NET API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore api-dotnet/Hng.Csharp.Web.sln
      - name: Build .NET API
        run: dotnet build api-dotnet/Hng.Csharp.Web.sln --no-restore --configuration Release
      # This job was named "Build and Test" but only ever built, and only the Web project. Nothing
      # ran the test suite, which is how 40 integration tests stayed red for months without anyone
      # noticing. The integration tests need a Docker daemon for Testcontainers; GitHub-hosted
      # runners provide one.
      - name: Test .NET API
        run: dotnet test api-dotnet/src/Tests/Tests.csproj --no-build --configuration Release --verbosity normal

  build-java:
    name: Build Java Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build Java worker
        run: |
          cd worker-java
          mvn package -q -DskipTests

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-dotnet, build-java]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Resolve Maven dependencies
        run: |
          cd worker-java
          mvn dependency:resolve -q
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
