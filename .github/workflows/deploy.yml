name: Build and Deploy
on:
  pull_request:
    branches: [staging, main]
    types: [closed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege: nothing here writes to the repo. Without this the default token
# is read/write for the whole repository.
permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Security Scan
    # head.repo.full_name, not repository.fork: the latter describes the repo the
    # workflow runs in (always false upstream), so it never actually guarded anything.
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps the token out of .git/config, where later steps could read it.
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Resolve Maven dependencies
        run: |
          cd worker-java
          mvn dependency:resolve -q
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy:
    name: Deploy
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    needs: [trivy-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event.pull_request.base.ref == 'main' && 'production' || 'staging' }}
    # One deploy at a time per environment. The script stops services, swaps the
    # publish directory and restarts; two overlapping runs would interleave those
    # steps on the same server. Queued rather than cancelled so a merge is never
    # silently skipped.
    concurrency:
      group: deploy-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
    # Overrides the workflow-level contents: read so the failure step below can
    # open an issue. Scoped to this job rather than the whole workflow.
    permissions:
      contents: read
      issues: write
    steps:
      # No checkout: the build runs on the remote host via ssh, so the runner's
      # workspace was never used. The secrets are passed to the action directly
      # rather than through a job-level env block, which would have exposed them
      # to every step in the job.
      - name: Deploy on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
              DEPLOY_DIR="/var/www/backend-production"
              API_NAME="api-production"
              WORKER_NAME="worker-production"
              BRANCH="main"
              API_PORT=5001
              START_SH="/etc/vulnwatch/production/start.sh"
              API_ENV="/etc/vulnwatch/production/api.env"
              WORKER_ENV="/etc/vulnwatch/production/worker.properties"
            else
              DEPLOY_DIR="/var/www/backend-staging"
              API_NAME="api-staging"
              WORKER_NAME="worker-staging"
              BRANCH="staging"
              API_PORT=5000
              START_SH="/etc/vulnwatch/staging/start.sh"
              API_ENV="/etc/vulnwatch/staging/api.env"
              WORKER_ENV="/etc/vulnwatch/staging/worker.properties"
            fi

            PUBLISH_DIR="$DEPLOY_DIR/publish"
            JAR_DIR="$DEPLOY_DIR/worker-java/target"
            PUBLISH_BACKUP="${PUBLISH_DIR}-backup"
            JAR_BACKUP="${JAR_DIR}-backup"
            # Where the new publish is built before it replaces the live one.
            PUBLISH_STAGE="${PUBLISH_DIR}-staging"

            # ── Check out the exact commit that was scanned ───────────────
            # Previously this pulled the branch tip, which is not necessarily the
            # commit trivy-scan just approved: anything merged between the scan and
            # the deploy shipped unscanned. Checking out the merge commit for this
            # run closes that window and makes the deploy reproducible — re-running
            # it deploys the same code rather than whatever has landed since.
            DEPLOY_SHA="${{ github.event.pull_request.merge_commit_sha || github.sha }}"
            echo "Deploying $DEPLOY_SHA on $BRANCH..."
            cd "$DEPLOY_DIR"
            git fetch origin "$BRANCH"

            if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              echo "Commit $DEPLOY_SHA not found after fetching $BRANCH. Aborting before anything is overwritten."
              exit 1
            fi

            git reset --hard "$DEPLOY_SHA"

            # ── Symlink env files and start script ────────────────────────
            echo "Linking start.sh..."
            ln -sf "$START_SH" "$DEPLOY_DIR/start.sh"

            echo "Linking api .env..."
            ln -sf "$API_ENV" "$DEPLOY_DIR/.env"

            echo "Linking worker application.properties..."
            ln -sfn "$WORKER_ENV" "$DEPLOY_DIR/worker-java/src/main/resources/application.properties"

            # ── Snapshot the current release ──────────────────────────────
            # Now taken for BOTH environments. It used to be production-only, which
            # left staging with nothing to roll back to, so any failure after the
            # builds stranded it on half-swapped artefacts.
            echo "Snapshotting current release..."

            if [ -d "$PUBLISH_DIR" ] && [ "$(ls -A "$PUBLISH_DIR" 2>/dev/null)" ]; then
              rm -rf "$PUBLISH_BACKUP"
              cp -r "$PUBLISH_DIR" "$PUBLISH_BACKUP"
            else
              echo "No existing .NET publish. Fresh deploy, nothing to snapshot."
            fi

            if [ -d "$JAR_DIR" ] && [ "$(ls -A "$JAR_DIR" 2>/dev/null)" ]; then
              rm -rf "$JAR_BACKUP"
              cp -r "$JAR_DIR" "$JAR_BACKUP"
            else
              echo "No existing Java JAR. Fresh deploy, nothing to snapshot."
            fi

            # Restores whatever was running before this deploy touched anything.
            # Services are not restarted here: nothing has been stopped at any point
            # where this is called, so the old processes are still serving.
            restore_previous_release() {
              echo "Restoring previous release..."
              rm -rf "$PUBLISH_STAGE"

              if [ -d "$JAR_BACKUP" ] && [ "$(ls -A "$JAR_BACKUP" 2>/dev/null)" ]; then
                rm -rf "$JAR_DIR"
                cp -r "$JAR_BACKUP" "$JAR_DIR"
              fi
            }

            # ── Build the .NET API into a staging directory ───────────────
            # Published beside the live directory rather than over it. The live
            # publish is not touched until migrations have also succeeded, so a
            # failure anywhere before the swap leaves code and schema exactly as they
            # were: no half-deployed state, and no new binaries sitting on disk
            # waiting for the next pm2 restart to pick them up.
            echo "Building .NET API..."
            rm -rf "$PUBLISH_STAGE"

            if ! dotnet publish "$DEPLOY_DIR/api-dotnet/src/Web" -c Release -o "$PUBLISH_STAGE"; then
              echo ".NET build failed. Live release untouched."
              restore_previous_release
              exit 1
            fi

            # ── Build the Java worker ─────────────────────────────────────
            # mvnw clean package writes into target/, which IS the live jar directory,
            # so this one cannot be staged the same way. The snapshot above is what
            # makes it recoverable.
            echo "Building Java worker..."
            if ! (cd "$DEPLOY_DIR/worker-java" && ./mvnw clean package -DskipTests); then
              echo "Java build failed."
              restore_previous_release
              exit 1
            fi

            # ── Apply database migrations ─────────────────────────────────
            # After the builds and before the swap. A build failure now means no schema
            # change at all, and a migration failure means no new code goes live, so the
            # old dilemma between "schema ahead of code" and "code ahead of schema"
            # simply does not arise.
            #
            # The app only self-migrates in Development (Program.cs), so without this
            # nothing applies them outside a developer machine, which is how staging
            # ended up missing AddWaitlistJoinOrigin and 500ing on every waitlist join.
            echo "Applying database migrations..."

            export PATH="$PATH:$HOME/.dotnet/tools"
            if ! command -v dotnet-ef >/dev/null 2>&1; then
              echo "Installing dotnet-ef..."
              dotnet tool install --global dotnet-ef || dotnet tool update --global dotnet-ef
            fi

            # Read the connection string with grep rather than sourcing the env file.
            # start.sh sources it and chokes on the multi-line PEM around line 56
            # ("RSA: command not found"), which silently drops every variable after that
            # point. Pulling out the one line we need avoids that entirely.
            DB_CONN=$(grep -m1 '^ConnectionStrings__DefaultConnectionString=' "$API_ENV" | cut -d= -f2-)
            DB_CONN="${DB_CONN%\"}"
            DB_CONN="${DB_CONN#\"}"

            if [ -z "$DB_CONN" ]; then
              echo "ConnectionStrings__DefaultConnectionString not found in $API_ENV. Aborting; nothing swapped."
              restore_previous_release
              exit 1
            fi

            if ! ConnectionStrings__DefaultConnectionString="$DB_CONN" dotnet ef database update \
                 --project "$DEPLOY_DIR/api-dotnet/src/Infrastructure" \
                 --startup-project "$DEPLOY_DIR/api-dotnet/src/Web" \
                 --configuration Release; then
              echo "Database migration failed. Nothing swapped; the running services are untouched."
              restore_previous_release
              exit 1
            fi

            echo "Migrations applied."

            # ── Promote the staged release ────────────────────────────────
            # Everything succeeded, so swap the new publish into place. Two renames on
            # the same filesystem rather than a copy, so the window in which the live
            # directory is incomplete is as small as it can be.
            echo "Promoting staged release..."
            rm -rf "${PUBLISH_DIR}-previous"

            if [ -d "$PUBLISH_DIR" ]; then
              mv "$PUBLISH_DIR" "${PUBLISH_DIR}-previous"
            fi

            if ! mv "$PUBLISH_STAGE" "$PUBLISH_DIR"; then
              echo "Failed to promote the staged release. Rolling back."
              rm -rf "$PUBLISH_DIR"
              mv "${PUBLISH_DIR}-previous" "$PUBLISH_DIR" || true
              restore_previous_release
              exit 1
            fi

            rm -rf "${PUBLISH_DIR}-previous"

            # ── Stop existing PM2 processes ───────────────────────────────
            echo "Stopping existing PM2 processes..."
            pm2 delete $API_NAME || true
            pm2 delete $WORKER_NAME || true
            pm2 flush $API_NAME || true
            pm2 flush $WORKER_NAME || true

            # ── Start .NET API ────────────────────────────────────────────
            echo "Starting $API_NAME..."
            pm2 start "$DEPLOY_DIR/start.sh" -f --name "$API_NAME" --cwd "$DEPLOY_DIR"

            # ── Start Java worker ─────────────────────────────────────────
            echo "Starting $WORKER_NAME..."
            pm2 start "java --enable-preview -jar $DEPLOY_DIR/worker-java/target/*.jar" --name "$WORKER_NAME"

            # ── Health check ──────────────────────────────────────────────
            echo "Running health check..."
            HEALTHY=false
            for i in $(seq 1 15); do
              sleep 3
              STATUS=$(curl -s --connect-timeout 2 --max-time 5 -o /dev/null -w "%{http_code}" http://localhost:$API_PORT/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                HEALTHY=true
                echo "Health check passed on attempt $i (HTTP $STATUS)"
                break
              else
                echo "Attempt $i: HTTP $STATUS, retrying..."
              fi
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "Health check failed."

              if [ "$BRANCH" = "main" ]; then
                echo "Rolling back production..."

                pm2 delete $API_NAME || true
                pm2 delete $WORKER_NAME || true

                if [ -d "$PUBLISH_BACKUP" ] && [ "$(ls -A $PUBLISH_BACKUP)" ]; then
                  echo "Rolling back .NET API..."
                  rm -rf "$PUBLISH_DIR"
                  cp -r "$PUBLISH_BACKUP" "$PUBLISH_DIR"
                fi

                if [ -d "$JAR_BACKUP" ] && [ "$(ls -A $JAR_BACKUP)" ]; then
                  echo "Rolling back Java worker..."
                  rm -rf "$JAR_DIR"
                  cp -r "$JAR_BACKUP" "$JAR_DIR"
                fi

                pm2 start "$DEPLOY_DIR/start.sh" -f --name "$API_NAME" --cwd "$DEPLOY_DIR"
                pm2 start "java --enable-preview -jar $JAR_DIR/*.jar" --name "$WORKER_NAME"
                pm2 save
                rm -rf "$PUBLISH_BACKUP" "$JAR_BACKUP"
                echo "Rollback successful. Services are running on previous version."
                exit 1
              else
                echo "WARNING: Staging health check failed. Deploy completed but the API may not be healthy."
              fi
            fi

            # ── Cleanup backups after a successful deploy ─────────────────
            # Unconditional now: snapshots are taken for both environments, so staging
            # would otherwise keep a stale copy around indefinitely.
            if true; then
              if [ -d "$PUBLISH_BACKUP" ]; then
                echo "Cleaning up .NET backup..."
                rm -rf "$PUBLISH_BACKUP"
              fi

              if [ -d "$JAR_BACKUP" ]; then
                echo "Cleaning up Java backup..."
                rm -rf "$JAR_BACKUP"
              fi
            fi

            echo "Deploy successful!"
            pm2 save
            pm2 list

      # A failed deploy used to be silent. deploy.yml was invalid from 2026-07-07
      # and every run failed in 0s for five weeks with nobody notified, while
      # merged PRs appeared to ship. This opens an issue so the next outage is
      # visible the same day. No external secrets needed — it uses GITHUB_TOKEN.
      - name: Open an issue if the deploy failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Deploy to $TARGET failed" \
            --body "The deploy for $PR_URL did not complete, so **$TARGET is still running the previous build**.

          Run: $RUN_URL

          Check in this order:
          1. Did the .NET or Java build fail? The script exits before touching services, so the old build is still serving.
          2. Did \`dotnet ef database update\` fail? Same — services untouched, but code and schema are now out of step.
          3. Did the health check fail on production? It rolls back automatically; confirm the rollback landed.

          Do not merge further promotions to $TARGET until this is resolved." || true
