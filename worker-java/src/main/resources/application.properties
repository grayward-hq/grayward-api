# ===================================================================
# DATABASE
# ===================================================================
spring.datasource.url=${spring.datasource.url:jdbc:postgresql://localhost:5432/vulnwatch_db}
spring.datasource.username=${spring.datasource.username:postgres}
spring.datasource.password=${spring.datasource.password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Tuning pool size based on expected production load
spring.datasource.hikari.maximum-pool-size=${spring.datasource.hikari.maximum-pool-size:20}
spring.datasource.hikari.minimum-idle=${spring.datasource.hikari.minimum-idle:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=none

# ===================================================================
# REDIS
# ===================================================================
redis.host=${redis.host:localhost}
redis.port=${redis.port:6379}
redis.password=${redis.password:}
redis.ssl=${redis.ssl:false}

# ===================================================================
# QUEUES
# ===================================================================
worker.scanjob.queue=${worker.scanjob.queue:scan-jobs}
worker.domain.result.queue=${worker.domain.result.queue:domain-intel}
worker.dlq.key=${worker.dlq.key:worker-dlq}
worker.state.ttl-seconds=86400
worker.blpop.timeout=30

# ===================================================================
# GITHUB
# ===================================================================
github.token=${github.token}

# ===================================================================
# AI PROVIDER
# ===================================================================
worker.ai.provider=${worker.ai.provider:openai}

# OpenAI
spring.ai.openai.api-key=${spring.ai.openai.api-key:}
spring.ai.openai.chat.options.model=${spring.ai.openai.chat.options.model:gpt-4o-mini}

# Groq
groq.base-url=${groq.base-url:https://api.groq.com/openai}
groq.api-key=${groq.api-key:}
groq.model=${groq.model:llama-3.3-70b-versatile}

# Anthropic Claude
spring.ai.anthropic.api-key=${spring.ai.anthropic.api-key:mock-key-placeholder-value}
spring.ai.anthropic.chat.options.model=${spring.ai.anthropic.chat.options.model:claude-3-5-sonnet-20241022}

# Google Gemini
spring.ai.google.genai.api-key=${spring.ai.google.genai.api-key:mock-key-placeholder-value}
spring.ai.google.genai.chat.options.model=${spring.ai.google.genai.chat.options.model:gemini-2.0-flash}

# ===================================================================
# SCAN TOOLS
# ===================================================================
# In production, use absolute paths to your scan binaries
tools.dnsrecon.binary=${tools.dnsrecon.binary:dnsrecon}
tools.nmap.binary=${tools.nmap.binary:nmap}
tools.nuclei.binary=${tools.nuclei.binary:nuclei}
tools.subfinder.binary=${tools.subfinder.binary:subfinder}
tools.testssl.binary=${tools.testssl.binary:testssl}
tools.trivy.binary=${tools.trivy.binary:trivy}
tools.temp=${tools.temp:/tmp/vulnwatch}

# Timeouts in seconds
tools.dnsrecon.timeout-seconds=150
tools.nmap.timeout-seconds=150
tools.nuclei.timeout-seconds=500
tools.subfinder.timeout-seconds=150
tools.testssl.timeout-seconds=150
tools.trivy.timeout-seconds=150

# ===================================================================
# SPRING & OPERATIONAL
# ===================================================================
spring.main.web-application-type=none
# Optimize startup by excluding unused web configurations
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.web.reactive.ReactiveWebServerFactoryAutoConfiguration,\
  org.springframework.boot.autoconfigure.web.reactive.ReactiveWebAutoConfiguration

# Management & Health (Highly recommended for production workers)
management.endpoints.web.exposure.include=health,info
logging.level.root=WARN
logging.level.com.vulnwatch=INFO