# ===================================================================
# DATABASE
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vulnwatch_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Tuning pool size based on expected production load
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_IDLE_SIZE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=none

# ===================================================================
# REDIS
# ===================================================================
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.ssl=${REDIS_SSL:false}

# ===================================================================
# QUEUES
# ===================================================================
worker.scanjob.queue=${SCAN_QUEUE:scan-jobs}
worker.domain.result.queue=${DOMAIN_QUEUE:domain-intel}
worker.dlq.key=${DLQ_KEY:worker-dlq}
worker.state.ttl-seconds=86400
worker.state.scan-key-prefix=${SCAN_STATE_KEY_PREFIX:scan-state:}
worker.state.surface-key-prefix=${SURFACE_STATE_KEY_PREFIX:surface-state:}

#NEW
worker.state.channel=${WORKER_STATE_CHANNEL:scan-state-events}

# ADDED ? CheckpointManager reads this; was missing, defaulted silently to
# 7200 before. Now explicit.
worker.checkpoint.ttl-seconds=7200

worker.blpop.timeout=30

# ===================================================================
# GITHUB
# ===================================================================
github.token=${GITHUB_TOKEN}

# ADDED ? GitHub App config for minting scoped installation tokens for
# private repo scans (GitHubAppJwtFactory / GitHubInstallationTokenService).
# Must be the SAME App ID + key the API uses (GitHubApp__AppId /
# GitHubApp__PrivateKeyPemPath), converted to PKCS8 for Java:
#   openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt \
#     -in original-key.pem -out pkcs8-key.pem
github.app.id=${GITHUB_APP_ID:}
github.app.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:}
github.api-url=${GITHUB_API_URL:https://api.github.com}

# ===================================================================
# AI PROVIDER
# ===================================================================
worker.ai.provider=${AI_PROVIDER:openai}

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# Groq
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Anthropic Claude
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:mock-key-placeholder-value}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}

# Google Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY:mock-key-placeholder-value}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash}

# ===================================================================
# SCAN TOOLS
# ===================================================================
# In production, use absolute paths to your scan binaries
tools.dnsrecon.binary=${DNSRECON_BIN:dnsrecon}
tools.nmap.binary=${NMAP_BIN:nmap}
tools.nuclei.binary=${NUCLEI_BIN:nuclei}
tools.subfinder.binary=${SUBFINDER_BIN:subfinder}
tools.testssl.binary=${TESTSSL_BIN:testssl}
tools.trivy.binary=${TRIVY_BIN:trivy}
tools.temp=${SCAN_TEMP_DIR:/tmp/vulnwatch}

# Timeouts in seconds
tools.dnsrecon.timeout-seconds=150
tools.nmap.timeout-seconds=150
tools.nuclei.timeout-seconds=500
tools.subfinder.timeout-seconds=150
tools.testssl.timeout-seconds=150
tools.trivy.timeout-seconds=150

# ===================================================================
# SPRING & OPERATIONAL
# ===================================================================
spring.main.web-application-type=none
# Optimize startup by excluding unused web configurations
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.web.reactive.ReactiveWebServerFactoryAutoConfiguration,\
  org.springframework.boot.autoconfigure.web.reactive.ReactiveWebAutoConfiguration

# Management & Health (Highly recommended for production workers)
management.endpoints.web.exposure.include=health,info
logging.level.root=WARN
logging.level.com.vulnwatch=INFO