# ===================================================================
# DATABASE CONFIGURATION
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=none

# ===================================================================
# CACHING & QUEUE
# ===================================================================
redis.host=${REDIS_HOST}
redis.port=${REDIS_PORT}
redis.password=${REDIS_PASSWORD}
redis.ssl=${REDIS_SSL:true}
worker.scanjob.queue=${WORKER_SCANJOB_QUEUE:scan-jobs}
worker.domain.result.queue=${WORKER_DOMAIN_RESULT_QUEUE:domain-intel}
worker.dlq.key=${WORKER_DLQ_KEY:worker-dlq}

# ===================================================================
# THIRD-PARTY INTEGRATIONS
# ===================================================================
github.token=${GITHUB_TOKEN}

# ===================================================================
# AI PROVIDER SETTINGS
# ===================================================================
# Set provider to: groq, anthropic, or google

# TTL for surface state and job state keys in Redis (24h)
worker.state.ttl-seconds=86400

# Polling timeout (seconds)
worker.blpop.timeout=30

# ===================================================================
# AI PROVIDER SETTINGS
# ===================================================================
worker.ai.provider=${AI_PROVIDER:openai}

spring.ai.openai.chat.enabled=${OPENAI_ENABLED:true}
spring.ai.anthropic.chat.enabled=${ANTHROPIC_ENABLED:false}
spring.ai.google.genai.chat.enabled=${GEMINI_ENABLED:false}

# 1. Dedicated Groq Properties (wired manually in AiConfig.java)
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
groq.api-key=${GROQ_API_KEY:mock-key-placeholder-value}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# 2. Native AI Starter Fallbacks
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.api-key=${OPENAI_API_KEY:your-openai-api-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:mock-key-placeholder-value}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}
spring.ai.anthropic.chat.options.max-tokens=${ANTHROPIC_MAX_TOKENS:800}

spring.ai.google.genai.api-key=${GEMINI_API_KEY:mock-key-placeholder-value}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash}

# Tell Spring Boot this is not a web app
spring.main.web-application-type=none
spring.profiles.active=dev

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.web.reactive.ReactiveWebServerFactoryAutoConfiguration,\
  org.springframework.boot.autoconfigure.web.reactive.ReactiveWebAutoConfiguration

# ===================================================================
# TOOL CONFIGURATION
# ===================================================================
tools.dnsrecon.timeout-seconds=150
tools.nmap.timeout-seconds=150
tools.nuclei.timeout-seconds=500
tools.subfinder.timeout-seconds=150
tools.testssl.timeout-seconds=150
tools.trivy.timeout-seconds=150

tools.dnsrecon.binary=${DNSRECON_BINARY:dnsrecon}
tools.nmap.binary=${NMAP_BINARY:nmap}
tools.nuclei.binary=${NUCLEI_BINARY:nuclei}
tools.subfinder.binary=${SUBFINDER_BINARY:subfinder}
tools.testssl.binary=${TESTSSL_BINARY:testssl}
tools.trivy.binary=${TRIVY_BINARY:trivy}

tools.temp=${TOOLS_TEMP:/tmp/vulnwatch}