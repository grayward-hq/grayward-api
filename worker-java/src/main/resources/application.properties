# ==============================================================================
# 1. APPLICATION BOOTSTRAP & SUB-SYSTEM OVERRIDES
# ==============================================================================
spring.main.web-application-type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.reactive.ReactiveWebServerFactoryAutoConfiguration,org.springframework.boot.autoconfigure.web.reactive.ReactiveWebAutoConfiguration

# ==============================================================================
# 2. DATA INFRASTRUCTURE (POSTGRES & REDIS)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vulnwatchdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.ssl=${REDIS_SSL:false}

# ==============================================================================
# 3. VULNWATCH CORE WORKER SETTINGS
# ==============================================================================
worker.scanjob.queue=${WORKER_SCANJOB_QUEUE:scan-jobs}
worker.domain.result.queue=${WORKER_DOMAIN_RESULT_QUEUE:scan-results}
worker.dlq.key=${WORKER_DLQ_KEY:dead-letter}
worker.surface.dlq.key=${WORKER_SURFACE_DLQ_KEY:surface-dead-letter}
worker.blpop.timeout=${WORKER_BLPOP_TIMEOUT:5}
worker.state.ttl-seconds=${WORKER_STATE_TTL_SECONDS:86400}

# ==============================================================================
# 4. THIRD-PARTY INTEGRATIONS
# ==============================================================================
github.token=${GITHUB_TOKEN:mock-github-token-fallback}

# ==============================================================================
# 5. AI ENGINE ACTIVATION & PROVIDERS
# ==============================================================================
worker.ai.provider=${AI_PROVIDER:openai}

# Spring AI auto-configuration switches
spring.ai.openai.chat.enabled=${OPENAI_ENABLED:true}
spring.ai.anthropic.chat.enabled=${ANTHROPIC_ENABLED:false}
spring.ai.google.genai.chat.enabled=${GEMINI_ENABLED:false}

# 5.1 GROQ (Wired via AiConfig.java)
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
groq.api-key=${GROQ_API_KEY:mock-key-placeholder-value}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# 5.2 NATIVE OPENAI
spring.ai.openai.api-key=${OPENAI_API_KEY:mock-key-placeholder-value}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# 5.3 ANTHROPIC CLAUDE
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:mock-key-placeholder-value}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}
spring.ai.anthropic.chat.options.max-tokens=${ANTHROPIC_MAX_TOKENS:800}

# 5.4 GOOGLE GEMINI
spring.ai.google.genai.api-key=${GEMINI_API_KEY:mock-key-placeholder-value}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash}

# ==============================================================================
# 6. RESILIENCE & CIRCUIT BREAKER
# ==============================================================================
worker.ai.cb.sliding-window-size=${AI_CB_SLIDING_WINDOW_SIZE:10}
worker.ai.cb.failure-rate-threshold=${AI_CB_FAILURE_RATE_THRESHOLD:50.0}
worker.ai.cb.wait-duration-seconds=${AI_CB_WAIT_DURATION_SECONDS:30}
worker.ai.cb.half-open-calls=${AI_CB_HALF_OPEN_CALLS:3}