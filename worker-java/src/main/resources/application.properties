# ===================================================================
# DATABASE CONFIGURATION
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vulnwatchdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

# ===================================================================
# CACHING & QUEUE
# ===================================================================
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.ssl=${REDIS_SSL:false}

worker.scanjob.queue=${WORKER_SCANJOB_QUEUE:scan-jobs}
worker.domain.result.queue=${WORKER_DOMAIN_RESULT_QUEUE:domain-intel}
worker.dlq.key=${WORKER_DLQ_KEY:worker-dlq}

# ===================================================================
# THIRD-PARTY INTEGRATIONS
# ===================================================================
github.token=${GITHUB_TOKEN:poiuytrewertyuio}

# ===================================================================
# AI PROVIDER SETTINGS
# ===================================================================
# Set provider to: groq, anthropic, or google
worker.ai.provider=${AI_PROVIDER:groq}

# TTL for surface state and job state keys in Redis (24h)
worker.state.ttl-seconds=86400
# 1. GROQ (OpenAI Compatible)
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${GROQ_API_KEY:mock-key-placeholder-value}
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.max-tokens=800
spring.ai.openai.chat.enabled=${AI_PROVIDER_IS_GROQ:true}

# 2. ANTHROPIC (Claude)
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:mock-key-placeholder-value}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
spring.ai.anthropic.chat.options.max-tokens=800
spring.ai.anthropic.chat.enabled=${AI_PROVIDER_IS_ANTHROPIC:false}

# 3. GOOGLE GEMINI (GenAI)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:mock-key-placeholder-value}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash}
spring.ai.google.genai.chat.enabled=${AI_PROVIDER_IS_GEMINI:false}

# Tell Spring Boot this is not a web app
spring.main.web-application-type=none

# Tool time-outs
tools.dnsrecon.timeout-seconds=150
tools.nmap.timeout-seconds=150
tools.nuclei.timeout-seconds=500
tools.subfinder.timeout-seconds=150
tools.testssl.timeout-seconds=150
tools.trivy.timeout-seconds=150

# Tool binaries
tools.dnsrecon.binary=${DNSRECON_BINARY:/Users/mitchelntuen/venv/bin/dnsrecon}
tools.nmap.binary=${NMAP_BINARY:nmap}
tools.nuclei.binary=${NUCLEI_BINARY:nuclei}
tools.subfinder.binary=${SUBFINDER_BINARY:subfinder}
tools.testssl.binary=${TESTSSL_BINARY:testssl}
tools.trivy.binary=${TRIVY_BINARY:trivy}

# Temp storage path for tool findings
tools.temp=${TRIVY_BINARY:/Users/mitchelntuen/temp}

# Profile
spring.profiles.active=dev

# Explicitly disable the reactive web server autoconfiguration class
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.web.reactive.ReactiveWebServerFactoryAutoConfiguration,\
  org.springframework.boot.autoconfigure.web.reactive.ReactiveWebAutoConfiguration