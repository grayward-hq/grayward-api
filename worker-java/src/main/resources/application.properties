# ===================================================================
# DATABASE
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/vulnwatch_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=none

# ===================================================================
# REDIS
# ===================================================================
redis.host=localhost
redis.port=6379
redis.password=
redis.ssl=false

# ===================================================================
# QUEUES
# ===================================================================
worker.scanjob.queue=scan-jobs
worker.domain.result.queue=domain-intel
worker.dlq.key=worker-dlq
worker.state.ttl-seconds=86400
worker.blpop.timeout=30

# ===================================================================
# GITHUB
# ===================================================================
github.token=placeholder

# ===================================================================
# AI PROVIDER
# ===================================================================
# Change this value to match the active pom.xml dependency:
#   openai / groq  ? spring-ai-starter-model-openai
#   anthropic      ? spring-ai-starter-model-anthropic
#   gemini         ? spring-ai-starter-model-google-genai
worker.ai.provider=openai

# ?? OpenAI ??????????????????????????????????????????????????????????
spring.ai.openai.api-key=
spring.ai.openai.chat.options.model=gpt-4o-mini

# ?? Groq (uses OpenAI-compatible API) ???????????????????????????????
groq.base-url=https://api.groq.com/openai
groq.api-key=your-groq-api-key-here
groq.model=llama-3.3-70b-versatile

# ?? Anthropic Claude ?????????????????????????????????????????????????
spring.ai.anthropic.api-key=placeholder
spring.ai.anthropic.chat.options.model=claude-sonnet-4-5
spring.ai.anthropic.chat.options.max-tokens=800

# ?? Google Gemini ????????????????????????????????????????????????????
spring.ai.google.genai.api-key=placeholder
spring.ai.google.genai.chat.options.model=gemini-2.0-flash

# ===================================================================
# SCAN TOOLS
# ===================================================================
tools.dnsrecon.binary=dnsrecon
tools.nmap.binary=nmap
tools.nuclei.binary=nuclei
tools.subfinder.binary=subfinder
tools.testssl.binary=testssl
tools.trivy.binary=trivy
tools.temp=/tmp/vulnwatch
tools.dnsrecon.timeout-seconds=150
tools.nmap.timeout-seconds=150
tools.nuclei.timeout-seconds=500
tools.subfinder.timeout-seconds=150
tools.testssl.timeout-seconds=150
tools.trivy.timeout-seconds=150

# ===================================================================
# SPRING
# ===================================================================
spring.main.web-application-type=none
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.web.reactive.ReactiveWebServerFactoryAutoConfiguration,\
  org.springframework.boot.autoconfigure.web.reactive.ReactiveWebAutoConfiguration