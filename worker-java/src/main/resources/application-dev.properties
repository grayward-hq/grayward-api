# =============================================================================
# VulnWatch Java Worker ? application.properties (local / dev profile)
# =============================================================================
# QUICK-START CHECKLIST (local testing)
# -----------------------------------------------------------------------------
# 1. Start Postgres locally (e.g. docker run -e POSTGRES_PASSWORD=postgres
#      -e POSTGRES_DB=vulnwatchdb -p 5432:5432 postgres:16)
# 2. Bootstrap the schema:  psql -U postgres -d vulnwatchdb -f init.sql
#    (The .NET API auto-runs EF migrations on startup if you prefer that path.)
# 3. The seed Scan row in init.sql has Id = 00000000-0000-0000-0000-000000000003
#    Push a matching ScanJob onto Redis (see shared/scan-job.schema.json):
#      redis-cli LPUSH scan-jobs '{"scanId":"00000000-0000-0000-0000-000000000003",
#        "domainId":"00000000-0000-0000-0000-000000000002","domain":"example.com",
#        "surfaceTypes":127,"coverage":1,"targetType":"Domain"}'
# 4. Run the worker:  ./mvnw spring-boot:run
# =============================================================================

# ===================================================================
# DATABASE ? Spring Boot autoconfigures DataSource + JdbcTemplate
#            from these properties; no manual DbConfig wiring needed.
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vulnwatchdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool (sensible defaults for a single-worker process)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# IMPORTANT: the worker does NOT manage schema migrations.
# The schema is owned by the .NET API (EF Core) or bootstrapped by init.sql.
# Setting this to 'none' prevents Hibernate from touching tables on startup.
spring.jpa.hibernate.ddl-auto=none

# ==============================================================================
# CORE AI ENGINE & PROVIDER SWITCHES (UPDATED & MATCHED TO MAIN)
# ==============================================================================
worker.ai.provider=${AI_PROVIDER:openai}

# FIXED: Aligned with new base properties structural chat toggles
spring.ai.openai.chat.enabled=${OPENAI_ENABLED:true}
spring.ai.anthropic.chat.enabled=${ANTHROPIC_ENABLED:false}
spring.ai.google.genai.chat.enabled=${GEMINI_ENABLED:false}

# ==============================================================================
# REAL TESTING API CREDENTIALS (GIT-IGNORED SAFE ZONE VIA ENVIRONMENT VARIABLES)
# ==============================================================================
# Keeps secrets out of GitHub. Values are injected automatically from your local .env file.
github.token=${GITHUB_TOKEN:YOUR_REAL_GITHUB_PERSONAL_ACCESS_TOKEN}

# 1. Dedicated Groq Properties (wired manually in AiConfig.java)
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
groq.api-key=${GROQ_API_KEY:mock-key-placeholder-value}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# 2. Native AI Starter Fallbacks
spring.ai.openai.api-key=
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# FIXED: Model identifier modernized to claude-sonnet-4-5 to match main configuration updates
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:mock-key-placeholder-value}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}
spring.ai.anthropic.chat.options.max-tokens=${ANTHROPIC_MAX_TOKENS:800}

spring.ai.google.genai.api-key=${GEMINI_API_KEY:mock-key-placeholder-value}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash}



# Tell Spring Boot this is not a web app
spring.main.web-application-type=none

# Tool time-outs
tools.dnsrecon.timeout-seconds=150
tools.nmap.timeout-seconds=150
tools.nuclei.timeout-seconds=550
tools.subfinder.timeout-seconds=150
tools.testssl.timeout-seconds=150
tools.trivy.timeout-seconds=150

# Tool binaries
tools.dnsrecon.binary=${DNSRECON_BINARY:dnsrecon}
tools.nmap.binary=${NMAP_BINARY:nmap}
tools.nuclei.binary=${NUCLEI_BINARY:nuclei}
tools.subfinder.binary=${SUBFINDER_BINARY:subfinder}
tools.testssl.binary=${TESTSSL_BINARY:./testssl}
tools.trivy.binary=${TRIVY_BINARY:trivy}

# FIX: was incorrectly set to ${TRIVY_BINARY:trivy} ? a copy-paste error from the
#      trivy binary line above. Every scanner was trying to write files into a path
#      like "trivy/nmap-<scanId>.xml" which does not exist, crashing all scans.
#      The directory must exist before the worker starts; create it in your
#      Dockerfile or entrypoint: RUN mkdir -p /tmp/vulnwatch
tools.temp=${TOOLS_TEMP:/tmp/vulnwatch}

# ==============================================================================
# LOCAL TESTING PERFORMANCE & SPEED-UP TUNES
# ==============================================================================
# Drops the polling cycle timeout down to 1 second so your test iterations cycle faster
worker.blpop.timeout=1

# Lowers state retention down to 10 minutes to prevent dirty states from hanging around too long locally
worker.state.ttl-seconds=600